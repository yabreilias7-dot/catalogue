<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mon catalogue</title>
<style>
:root{--bg:#10201a;--s:#1a2e25;--line:#2d4a3a;--ink:#f0f6ee;--mut:#a9c0b0;--wa:#2fc46a;--wak:#06210f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;line-height:1.45;padding:22px 16px calc(40px + env(safe-area-inset-bottom,0px));max-width:560px;margin-inline:auto}
h1{font-family:Georgia,serif;font-size:2.1rem;line-height:1.12;margin:6px 0 10px}
.mut{color:var(--mut);margin:0 0 18px}
label{display:block;font-weight:700;margin:18px 0 8px}
input{width:100%;padding:14px;font:inherit;font-size:1.05rem;background:var(--s);color:var(--ink);border:2px solid var(--line);border-radius:14px}
input:focus,button:focus-visible{outline:3px solid var(--wa);outline-offset:2px}
.row{display:flex;gap:10px}
.item{display:flex;gap:10px;align-items:stretch;margin-bottom:12px}
.ph{flex:0 0 96px;height:96px;border:2px dashed var(--line);border-radius:14px;background:var(--s);display:grid;place-items:center;text-align:center;color:var(--mut);font-size:.9rem;overflow:hidden;cursor:pointer;margin:0;font-weight:400}
.ph img{width:100%;height:100%;object-fit:cover}
.f{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.f input{padding:11px 12px}
.x{flex:0 0 44px;background:var(--s);color:var(--ink);border:2px solid var(--line);border-radius:14px;font-size:1.3rem}
button{font:inherit;cursor:pointer}
.main,.ghost{display:block;width:100%;padding:15px;border-radius:14px;font-weight:700;font-size:1.05rem;margin-top:12px}
.main{background:var(--wa);color:var(--wak);border:0}
.ghost{background:var(--s);color:var(--ink);border:2px solid var(--line)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px}
.card{background:var(--s);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.card .b{padding:10px 10px 12px}
.card b{display:block;overflow-wrap:anywhere}
.pr{color:var(--wa);font-weight:700;font-size:1.1rem;margin-top:2px}
.card button{padding:11px;font-size:.95rem;margin-top:8px}
@media(max-width:340px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
let S={shop:'',cc:'226',phone:'',items:[]};
try{const r=localStorage.getItem('cat2');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem('cat2',JSON.stringify(S))}catch(e){alert('Mémoire pleine : supprimez une photo ou un produit.')}};
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=p=>p?Number(p).toLocaleString('fr-FR')+' F':'';
const num=()=>(S.cc+S.phone).replace(/\D/g,'');

function compress(file,cb){
  const r=new FileReader();
  r.onload=()=>{const im=new Image();
    im.onload=()=>{const m=600,k=Math.min(1,m/Math.max(im.width,im.height));
      const c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.72))};
    im.src=r.result};
  r.readAsDataURL(file);
}

function edit(){
  $('#app').innerHTML=`<h1>Créez le catalogue de votre boutique.</h1>
  <p class="mut">Ajoutez vos produits avec une photo et un prix. Vos clients commandent par WhatsApp. Tout reste enregistré sur ce téléphone.</p>
  <label for="shop">Nom de la boutique</label>
  <input id="shop" placeholder="Boutique Awa" value="${esc(S.shop)}">
  <label for="ph">Indicatif du pays et numéro WhatsApp</label>
  <div class="row"><input id="cc" inputmode="numeric" style="max-width:92px" value="${esc(S.cc)}" aria-label="Indicatif"><input id="ph" inputmode="tel" placeholder="70 12 34 56" value="${esc(S.phone)}"></div>
  <label>Vos produits</label><div id="list"></div>
  <button class="ghost" id="add">Ajouter un produit</button>
  <button class="main" id="go">Voir mon catalogue</button>`;
  $('#shop').oninput=e=>{S.shop=e.target.value;save()};
  $('#cc').oninput=e=>{S.cc=e.target.value;save()};
  $('#ph').oninput=e=>{S.phone=e.target.value;save()};
  S.items.forEach((it,i)=>{
    const d=document.createElement('div');d.className='item';
    d.innerHTML=`<label class="ph">${it.img?`<img src="${it.img}" alt="">`:'<span>Ajouter<br>une photo</span>'}<input type="file" accept="image/*" hidden></label>
    <div class="f"><input class="n" placeholder="Produit (ex. Robe wax)" value="${esc(it.name)}"><input class="p" inputmode="numeric" placeholder="Prix en F" value="${esc(it.price)}"></div>
    <button class="x" aria-label="Supprimer">×</button>`;
    d.querySelector('.n').oninput=e=>{it.name=e.target.value;save()};
    d.querySelector('.p').oninput=e=>{it.price=e.target.value.replace(/\D/g,'');e.target.value=it.price;save()};
    d.querySelector('input[type=file]').onchange=e=>{const f=e.target.files[0];if(f)compress(f,u=>{it.img=u;save();edit()})};
    d.querySelector('.x').onclick=()=>{S.items.splice(i,1);save();edit()};
    $('#list').appendChild(d);
  });
  $('#add').onclick=()=>{S.items.push({name:'',price:'',img:''});save();edit()};
  $('#go').onclick=()=>{
    if(!S.items.length){alert('Ajoutez au moins un produit.');return}
    if(!num()){alert('Entrez votre numéro WhatsApp pour recevoir les commandes.');return}
    view();
  };
  if(!S.items.length){S.items.push({name:'',price:'',img:''});edit()}
}

async function share(it){
  const t=`${it.name||'Produit'} - ${fmt(it.price)}\nPour commander, écrivez-moi sur WhatsApp : https://wa.me/${num()}`;
  try{
    if(it.img){const b=await (await fetch(it.img)).blob();const f=new File([b],'produit.jpg',{type:'image/jpeg'});
      if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],text:t});return}}
    if(navigator.share){await navigator.share({text:t});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');
}

function view(){
  $('#app').innerHTML=`<h1>${esc(S.shop||'Mon catalogue')}</h1>
  <p class="mut">Touchez « Commander » pour écrire sur WhatsApp, ou « Partager » pour envoyer la photo et le prix.</p>
  <div class="grid">${S.items.map((it,i)=>`<div class="card">${it.img?`<img src="${it.img}" alt="${esc(it.name)}">`:''}<div class="b"><b>${esc(it.name||'Produit')}</b><div class="pr">${fmt(it.price)}</div><button class="main" data-o="${i}">Commander</button><button class="ghost" data-s="${i}">Partager</button></div></div>`).join('')}</div>
  <button class="ghost" id="back">Modifier mon catalogue</button>`;
  document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{
    const it=S.items[b.dataset.o];
    window.open(`https://wa.me/${num()}?text=`+encodeURIComponent(`Bonjour, je voudrais commander : ${it.name||'Produit'} (${fmt(it.price)})`),'_blank');
  });
  document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>share(S.items[b.dataset.s]));
  $('#back').onclick=edit;
}

edit();
</script>
</body>
</html>
